# Builds an installable Android APK on every push to main (or by hand from the
# Actions tab). Download it from the run's "Artifacts" section and open it on
# the phone. The APK is signed with the standard debug key: fine for sharing
# with members directly, but a Play Store release needs its own key (EAS).
name: Android APK

on:
  push:
    branches: [main]
  # Pull requests build too, to catch a broken build before it reaches main
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Public values, the same ones the website uses (repository Settings > Secrets and variables > Actions)
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.EXPO_PUBLIC_RAZORPAY_KEY_ID }}
      EXPO_PUBLIC_API_URL: https://sarigamaparishath.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        run: |
          missing=""
          for v in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_RAZORPAY_KEY_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            # A pull request may build without them (the APK just can't log in or pay)
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::Missing repository secrets:$missing"
            else
              echo "::error::Add these repository secrets first:$missing"
              exit 1
            fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: parishath-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
